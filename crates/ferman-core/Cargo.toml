[package]
name = "ferman-core"
description = "Ferman document model: parsing and writing with lopdf, content-stream interpreter, revisions and safe saving."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
flate2.workspace = true
weezl.workspace = true
lopdf.workspace = true
sha2.workspace = true
md-5.workspace = true
aes.workspace = true
rc4.workspace = true
stringprep.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true
# AES initialisation vectors and the new /ID of an incremental update (M3 plan, decision 7): the
# version lopdf already pulls, so Cargo.lock gains no package.
getrandom = "0.4.3"

# The save sequence's system calls the standard library lacks (`platform`, ADR 0008 and 0010, M3
# plan question 1): statvfs and fcopyfile on Unix, ReplaceFileW and its kin on Windows. The
# versions already in Cargo.lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
# Entry points for the fuzz targets in fuzz/; nothing else enables it.
fuzzing = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

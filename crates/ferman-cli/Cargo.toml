[package]
name = "ferman-cli"
description = "The ferman command line, built on the same facade as the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ferman"
path = "src/main.rs"

[dependencies]
# The facade only: the frb feature stays off, so the CLI carries no bridge code (ADR 0003).
ferman-api = { workspace = true, default-features = false }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true

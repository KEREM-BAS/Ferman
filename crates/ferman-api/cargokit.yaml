# cargokit options for the Flutter app build (app/rust_builder). The app always builds the
# bridge surface; ferman-cli and the tests build ferman-api without it (ADR 0003).
# cargokit reads each Flutter build mode separately (profile is not release), so all three
# are listed; a mode left out builds an engine without the bridge.
cargo:
  debug:
    extra_flags:
      - --features
      - frb
  profile:
    extra_flags:
      - --features
      - frb
  release:
    extra_flags:
      - --features
      - frb

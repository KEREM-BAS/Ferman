[package]
name = "ferman-api"
description = "The only crate the Ferman UI calls: a pure-Rust facade plus the flutter_rust_bridge surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# rlib for ferman-cli and tests; cdylib (Linux, Windows) and staticlib (macOS) are what cargokit
# builds for the Flutter app (app/rust_builder).
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
# The Dart bridge surface (the `frb` module). On in the app build; off for ferman-cli and the
# integration tests, which call the facade directly (ADR 0003).
frb = ["dep:flutter_rust_bridge"]
# The local MCP server for AI clients (ADR 0019): `facade::mcp`, with rmcp and tokio. On in the
# desktop app; off for ferman-cli and the web build.
mcp = ["dep:rmcp", "dep:tokio", "dep:serde_json", "dep:getrandom"]

[dependencies]
ferman-core.workspace = true
ferman-fonts.workspace = true
ferman-text.workspace = true
ferman-render.workspace = true
ferman-ops.workspace = true
futures-channel.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
flutter_rust_bridge = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# The MCP host's token (`mcp`), the version ferman-core uses.
getrandom = { version = "0.4.3", optional = true }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
# The MCP test's runtime joins the server and a stand-in client (feature `mcp`).
tokio = { workspace = true, features = ["macros", "io-util", "net"] }

[[bench]]
name = "edit_and_save"
harness = false

[lints]
workspace = true

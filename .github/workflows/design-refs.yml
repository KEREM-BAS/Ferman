# Renders the design boards to PNG (tools/design-refs) as the reference for the app's goldens.
# Pull requests render the M1 and M2 boards with their language variants, twice, and check that
# the two runs are identical; a manual run renders every board and variant twice. Then the
# committed goldens are compared with the references (`node index.mjs compare`): the report goes
# to the step summary and, on pull requests from this repository, to one pull-request comment; the
# scores are informative and never fail the job. The browser is fetched by
# tools/design-refs/fetch-chromium.sh, never by the Playwright installer (which would also
# download an LGPL ffmpeg build).
name: Design references

on:
  pull_request:
    paths:
      - design/**
      - tools/design-refs/**
      - app/lib/**
      - app/test/**
      - .github/workflows/design-refs.yml
  workflow_dispatch:

concurrency:
  group: design-refs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render design references
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: tools/design-refs
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/design-refs/.nvmrc
      - run: npm ci
      - name: System libraries and fonts for Chromium (apt only, no browser download)
        run: npx --no-install playwright-core install-deps chromium-headless-shell
      - name: Chromium headless shell 1194 (SHA-256 checked; no Playwright installer, no ffmpeg)
        run: |
          exe=$(./fetch-chromium.sh "$RUNNER_TEMP/chromium")
          echo "FERMAN_CHROMIUM=$exe" >> "$GITHUB_ENV"
      - name: Render the M1 and M2 boards, twice
        if: github.event_name == 'pull_request'
        run: node index.mjs --only @m1,@m2 --twice
      - name: Render every board, twice
        if: github.event_name == 'workflow_dispatch'
        run: node index.mjs --twice
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: design-refs
          path: build/design-refs/
          if-no-files-found: warn
          retention-days: 14
      - name: Compare the goldens with the references (informative; scores never fail the job)
        if: ${{ !cancelled() && hashFiles('build/design-refs/*.png') != '' }}
        run: |
          node index.mjs compare
          cat ../../build/design-compare/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('build/design-compare/report.md') != '' }}
        with:
          name: design-compare
          path: build/design-compare/
          if-no-files-found: warn
          retention-days: 14
      - name: Post the comparison report on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('build/design-compare/report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The report is informative and is also in the step summary and the
          # design-compare artifact, so a GitHub API failure here is retried and
          # then only warned about; it never turns the check red.
          for attempt in 1 2 3; do
            if gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file ../../build/design-compare/report.md --edit-last --create-if-none; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::warning::Could not post the comparison report on the pull request after 3 attempts; it is in the step summary and the design-compare artifact."

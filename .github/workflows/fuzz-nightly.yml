# Every fuzz target for one hour, each night (ROADMAP §6, Proposed with the M2 plan), beside the
# 60-second smoke run of every pull request in ci.yml. A crash uploads its input; it becomes a
# corpus regression file by hand. Scheduled runs use the default branch.
# Every action is pinned by commit SHA (tools/checks action_pins).
name: Fuzz nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }} for 1 hour
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The targets of fuzz/fuzz_targets/; the first step fails when they drift.
        target:
          - cmap
          - content_lexer
          - edit_script
          - filter_ascii85
          - filter_ascii_hex
          - filter_flate
          - filter_lzw
          - filter_run_length
          - font_program
          - image_layer
          - interpreter
          - line_breaking
          - open_document
          - recovery_journal
          - reencode
          - rewrite_block
          - security_handler
          - shaping
          - subsetting
          - syntax_object
          - to_unicode
          - type1
          - type1_program
          - writer_round_trip
          - xref_repair
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The matrix names every target
        env:
          LISTED: cmap content_lexer edit_script filter_ascii85 filter_ascii_hex filter_flate filter_lzw filter_run_length font_program image_layer interpreter line_breaking open_document recovery_journal reencode rewrite_block security_handler shaping subsetting syntax_object to_unicode type1 type1_program writer_round_trip xref_repair
        run: |
          actual="$(ls fuzz/fuzz_targets | sed 's/\.rs$//' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$LISTED" ]; then
            echo "::error::fuzz/fuzz_targets has: $actual; update the matrix and LISTED"
            exit 1
          fi
      - name: Install the fuzz nightly (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Cache cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install --locked cargo-fuzz@0.13.2
      - name: One hour
        working-directory: fuzz
        # One input may still allocate at most 2 GB (malloc_limit). The whole process gets 4 GB: over
        # an hour ASan's allocator keeps freed memory, and xref_repair's RSS reached 2 GB on
        # 2026-11-02 with a live heap of 27 MB (the input it named peaks at 180 MB on its own).
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          corpus=()
          case "$TARGET" in
            font_program | shaping | subsetting)
              mkdir -p "corpus/$TARGET"
              corpus=("corpus/$TARGET" seeds/fonts)
              ;;
            image_layer)
              mkdir -p "corpus/$TARGET"
              corpus=("corpus/$TARGET" seeds/images)
              ;;
          esac
          cargo fuzz run "$TARGET" "${corpus[@]}" -- -max_total_time=3600 -rss_limit_mb=4096 -malloc_limit_mb=2048
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

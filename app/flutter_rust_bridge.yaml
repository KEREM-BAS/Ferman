# flutter_rust_bridge 2.13.0 code generation (ADR 0002). Run from app/:
#   flutter_rust_bridge_codegen generate
# then `cargo fmt -p ferman-api` (the generated Rust follows our edition 2024 style only after it).
# Only the `frb` module of ferman-api is scanned; the facade carries frb(ignore).
rust_input: crate::frb
rust_root: ../crates/ferman-api/
rust_features:
  - frb
dart_output: lib/bridge/
dart_entrypoint_class_name: FermanBridge
add_mod_to_lib: false
dart_format_line_length: 80
# The Dco codec (Q19, ADR 0009): a Vec<u8> crosses as external typed data, without a copy. It needs
# ffigen (a dev dependency) and libclang: Xcode's on macOS, which ffigen finds itself, and
# Ubuntu's libclang-dev in the CI codegen job, named here because ffigen's own list stops at LLVM 15.
full_dep: true
llvm_path:
  - /usr/lib/llvm-18

name: ferman
description: "Ferman, a free and open-source PDF editor."
publish_to: 'none'
# Keep in sync with [workspace.package] version in the root Cargo.toml
# (tools/checks version_sync).
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_rust_bridge: 2.13.0
  go_router: ^18.1.0
  intl: ^0.20.3
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  window_manager: ^0.5.2

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: false

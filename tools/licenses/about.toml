# cargo-about 0.9.2: the Rust crates that ship in the app, for Settings › Licences (M4 plan,
# question 7). Read by tools/licenses/generate.sh; keep it in step with deny.toml.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
# deny.toml's desktop targets: a crate any of them builds ships on that system.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# What ships: build-time and test-only crates do not.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Ferman's own crates are Apache-2.0, which the pane says at its top.
private = { ignore = true }

# crates.io shows "non-standard" for allo-isolate (from flutter_rust_bridge); its licence file is
# the Apache-2.0 text (deny.toml clarifies it the same way). The checksum pins the file.
[allo-isolate.clarify]
license = "Apache-2.0"

[[allo-isolate.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4"

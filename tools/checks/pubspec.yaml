name: checks
description: >-
  Repository checks for Ferman: design/ untouched, unsafe-code roots, crate
  graph, pinned actions, version sync, ARB parity, pub deny list and
  flutter_rust_bridge versions. Pure Dart, run in CI and before a commit.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.33.0
  very_good_analysis: ^11.0.0

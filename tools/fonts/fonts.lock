# Fonts bundled with Ferman (ADR 0013, docs/DEPENDENCIES.md section 5.2).
# Read by tools/fonts/fetch.sh; the format is described in tools/fonts/README.md.
#
#   url      <release zip URL; {package} and {version} are filled in>
#   package  <package> <version> <SHA-256 of the release zip>
#   license  <package> LICENSE.txt <SHA-256 of the file as released, with CRLF line endings>
#   font     <package> <file name> <SHA-256 of the file as released>
#   file     <folder> <installed name> <SHA-256> <URL>
#
# Each file is taken from ibm-<package>/LICENSE.txt or ibm-<package>/fonts/complete/ttf/
# inside the zip and installed unmodified in app/assets/fonts/ibm-<package>/.
# Weights follow the design system's @font-face set (tokens/fonts.css) plus the italic
# UI text of the font picker's missing state (forms.css); see tools/fonts/README.md.

url https://github.com/IBM/plex/releases/download/%40ibm%2F{package}%40{version}/ibm-{package}.zip


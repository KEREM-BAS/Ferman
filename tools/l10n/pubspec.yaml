name: l10n
description: >-
  Generates app/lib/l10n/isolated_fallback.g.dart, the English strings wrapped
  in left-to-right isolates for an untranslated right-to-left app language
  (G93), from the gen-l10n output, and the translation table of
  docs/TRANSLATION_REVIEW.md from the ARB files. Pure Dart; run `dart run l10n`
  or `dart run l10n:review_table` in this directory.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  path: ^1.9.1

dev_dependencies:
  test: ^1.33.0
  very_good_analysis: ^11.0.0

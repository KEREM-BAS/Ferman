# Fonts the corpus generators embed that Ferman does not bundle (ADR 0020). Read by
# tools/corpus/fetch-fonts.sh, which downloads them, and by the generators, which refuse a file
# whose SHA-256 differs.
#
#   file <name in build/corpus-fonts/> <SHA-256> <URL>
#
# They go to build/corpus-fonts/ (gitignored): never committed and never shipped. Each is OFL-1.1
# with no Reserved Font Name, from google/fonts at commit 47d54ca (2026-10-16); its licence file
# comes with it. The PDFs embed subsets, which OFL-1.1 allows.

# kira-tr Madde 6: a font Ferman does not bundle, for the missing-glyph path (ROADMAP E02, E03).

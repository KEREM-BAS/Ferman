<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/ferman-design-system-27832349-21bc-410e-acd5-6ab20d2f87e2/styles.css">
<link rel="stylesheet" href="ds-additions/fm-additions.css">
<script src="ds-additions/fm-icons.js"></script>
<script src="_ds/ferman-design-system-27832349-21bc-410e-acd5-6ab20d2f87e2/_ds_bundle.js"></script>
</helmet>
<div role="region" aria-label="{{ title }}" style="display:grid;gap:12px;padding:12px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--border-subtle)">
<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-sm);background:{{ bg }};border:1px solid {{ border }}"><x-import component-from-global-scope="FermanDesignSystem_278323.Icon" name="{{ icon }}" size="{{ 20 }}" color="{{ fg }}" hint-size="20px,20px"></x-import><span style="display:grid;gap:3px"><span style="font:600 14px/20px var(--font-ui);color:{{ fg }}">{{ title }}</span><span style="font:var(--type-body);color:var(--text-primary)">{{ text }}</span></span></div>
<div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font:var(--type-caption)"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="6"><span style="color:var(--text-secondary)">{{ r.k }}</span><span style="color:{{ r.c }};font-variant-numeric:tabular-nums">{{ r.v }}</span></sc-for></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{ actions }}" as="a" hint-placeholder-count="2"><x-import component-from-global-scope="FermanDesignSystem_278323.Button" size="sm" variant="{{ a.v }}" icon="{{ a.icon }}" hint-size="120px,26px">{{ a.label }}</x-import></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:420},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;valid&quot;,&quot;warn&quot;,&quot;invalid&quot;,&quot;modified&quot;],&quot;default&quot;:&quot;valid&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const S = {
  valid: ['badge-check', 'var(--success-bg)', 'var(--success-border)', 'var(--success)', 'Valid signature', 'Signed by Ayşe Yılmaz with a qualified electronic certificate (NES). The document hasn’t changed since it was signed.'],
  warn: ['shield-alert', 'var(--warning-bg)', 'var(--warning-border)', 'var(--warning)', 'Valid, with 2 warnings', 'The signature and the document are intact. The signing time comes from the signer’s computer, not a timestamp server, and Ferman couldn’t check revocation because this device is offline.'],
  invalid: ['shield-x', 'var(--danger-bg)', 'var(--danger-border)', 'var(--danger)', 'Invalid signature', 'Mert Kaya’s certificate was revoked on 02.09.2026, before this document was signed on 05.10.2026. Treat this signature as missing.'],
  modified: ['file-pen-line', 'var(--warning-bg)', 'var(--warning-border)', 'var(--warning)', 'Changed after signing', 'Ayşe Yılmaz’s signature is valid for the version she signed. After that, text on page 1 (Madde 4) was changed. The signature doesn’t cover this change.']
};
class Component extends DCLogic {
  renderVals() {
    const st = S[this.props.state] ? this.props.state : 'valid';
    const s = S[st];
    const ok = 'var(--text-primary)', warn = 'var(--warning)', bad = 'var(--danger)';
    const who = st === 'invalid' ? 'Mert Kaya' : 'Ayşe Yılmaz';
    const rows = [
      { k: 'Signed by', v: who + ' · T.C. ' + (st === 'invalid' ? '357******50' : '412******16'), c: ok },
      { k: 'Issued by', v: 'TÜRKSERT ESHS · trusted (Turkish root)', c: ok },
      { k: 'Certificate', v: st === 'invalid' ? 'Revoked on 02.09.2026' : 'Valid until 21.03.2028', c: st === 'invalid' ? bad : ok },
      { k: 'Signed on', v: st === 'warn' ? '13.10.2026 14:41 · signer’s clock' : st === 'invalid' ? '05.10.2026 09:12 · timestamp' : '13.10.2026 14:41:07 · timestamp', c: st === 'warn' ? warn : ok },
      { k: 'Revocation', v: st === 'warn' ? 'Not checked · offline' : 'Checked when signed (OCSP)', c: st === 'warn' ? warn : ok },
      { k: 'Covers', v: st === 'modified' ? 'Revision 2 of 3 · pages 1–3' : 'The whole document', c: st === 'modified' ? warn : ok },
      { k: 'Format', v: 'PAdES-B-LT · RSA 2048 · SHA-256', c: 'var(--text-secondary)' }
    ];
    const actions = st === 'modified' ? [{ label: 'Show signed version', v: 'secondary', icon: 'eye' }, { label: 'Compare', v: 'ghost', icon: 'git-compare' }]
      : st === 'warn' ? [{ label: 'Check again', v: 'secondary', icon: 'refresh-cw' }, { label: 'Certificate…', v: 'ghost', icon: 'badge-check' }]
      : [{ label: 'Certificate…', v: 'secondary', icon: 'badge-check' }, { label: 'Go to signature', v: 'ghost', icon: 'arrow-right' }];
    return { icon: s[0], bg: s[1], border: s[2], fg: s[3], title: s[4], text: s[5], rows, actions };
  }
}
</script>
</body>
</html>

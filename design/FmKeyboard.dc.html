<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/ferman-design-system-27832349-21bc-410e-acd5-6ab20d2f87e2/styles.css">
<link rel="stylesheet" href="ds-additions/fm-additions.css">
<script src="ds-additions/fm-icons.js"></script>
<script src="_ds/ferman-design-system-27832349-21bc-410e-acd5-6ab20d2f87e2/_ds_bundle.js"></script>
</helmet>
<div aria-hidden="true" style="flex:none;display:grid;gap:{{ rowGap }};padding:{{ pad }};background:{{ bg }};font:400 22px/1 -apple-system,'IBM Plex Sans',sans-serif;color:{{ fg }}">
<sc-if value="{{ hasSugg }}"><div style="height:36px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;text-align:center;font:400 16px/1 var(--font-ui);color:{{ fg }}"><sc-for list="{{ sugg }}" as="s" hint-placeholder-count="3"><span style="border-inline-end:{{ s.sep }}">{{ s.t }}</span></sc-for></div></sc-if>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="3"><div style="display:flex;justify-content:center;gap:{{ keyGap }};padding-inline:{{ r.inset }}"><sc-for list="{{ r.keys }}" as="k" hint-placeholder-count="10"><span style="flex:{{ k.flex }};height:{{ keyH }};display:grid;place-items:center;border-radius:{{ keyR }};background:{{ k.bg }};box-shadow:{{ shadow }};font:{{ k.font }}"><sc-if value="{{ k.isIcon }}"><x-import component-from-global-scope="FermanDesignSystem_278323.Icon" name="{{ k.icon }}" size="{{ 20 }}" stroke-width="{{ 1.8 }}" hint-size="20px,20px"></x-import></sc-if><sc-if value="{{ k.isText }}">{{ k.t }}</sc-if></span></sc-for></div></sc-for>
<div style="height:{{ bottomH }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:300},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tr&quot;,&quot;en&quot;,&quot;ar&quot;,&quot;num&quot;],&quot;default&quot;:&quot;tr&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;suggestions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}">
const LAYOUT = {
  tr: [['q', 'w', 'e', 'r', 't', 'y', 'u', 'ı', 'o', 'p', 'ğ', 'ü'], ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ş', 'i'], ['z', 'x', 'c', 'v', 'b', 'n', 'm', 'ö', 'ç']],
  en: [['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'], ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'], ['z', 'x', 'c', 'v', 'b', 'n', 'm']],
  ar: [['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ه', 'خ', 'ح', 'ج'], ['ش', 'س', 'ي', 'ب', 'ل', 'ا', 'ت', 'ن', 'م', 'ك', 'ط'], ['ئ', 'ء', 'ؤ', 'ر', 'ى', 'ة', 'و', 'ز', 'ظ']],
  num: [['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'], ['-', '/', ':', ';', '(', ')', '₺', '&', '@', '"'], ['.', ',', '?', '!', '’']]
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const ios = (p.platform || 'ios') === 'ios';
    const dark = !!p.dark;
    const lay = LAYOUT[p.layout || 'tr'] || LAYOUT.tr;
    const keyBg = dark ? '#6B6B6B' : '#FFFFFF';
    const modBg = dark ? '#474747' : (ios ? '#ABB0BA' : '#C7CBD3');
    const letter = (t) => ({ t: p.caps ? t.toLocaleUpperCase('tr') : t, flex: '1 1 0', bg: keyBg, isText: true, isIcon: false, font: '400 22px/1 var(--font-ui)' });
    const mod = (icon, t, flex) => ({ icon, t, flex: flex || '1.4 1 0', bg: modBg, isIcon: !!icon, isText: !icon, font: '400 15px/1 var(--font-ui)' });
    const rows = [
      { inset: '0', keys: lay[0].map(letter) },
      { inset: lay[1].length < lay[0].length ? '14px' : '0', keys: lay[1].map(letter) },
      { inset: '0', keys: [mod('arrow-big-up')].concat(lay[2].map(letter)).concat([mod('delete')]) },
      { inset: '0', keys: [mod(null, p.layout === 'num' ? 'ABC' : '123', '1.3 1 0'), mod('globe', null, '1.1 1 0'), { t: p.space || (ios ? 'space' : 'Türkçe'), flex: '5 1 0', bg: keyBg, isText: true, isIcon: false, font: '400 15px/1 var(--font-ui)' }, mod(null, p.ret || 'return', '2.2 1 0')] }
    ];
    const sugg = (p.suggestions || []).map((t, i, arr) => ({ t, sep: i < arr.length - 1 ? '1px solid ' + (dark ? '#555' : '#C3C6CC') : 'none' }));
    return {
      rows, bg: dark ? '#2B2B2B' : (ios ? '#D1D3D9' : '#E8EAF0'), fg: dark ? '#FFFFFF' : '#000000',
      rowGap: ios ? '11px' : '9px', keyGap: ios ? '6px' : '5px', keyH: ios ? '42px' : '44px', keyR: ios ? '5px' : '6px',
      shadow: ios ? '0 1px 0 rgba(0,0,0,.3)' : 'none', pad: ios ? '6px 3px 0' : '8px 6px 0',
      hasSugg: sugg.length > 0, sugg, bottomH: ios ? '30px' : '30px'
    };
  }
}
</script>
</body>
</html>

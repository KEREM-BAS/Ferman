<dc-import name="FmBoard" bid="a11-1" num="11.1a" title="Settings — General" note="Settings open in their own window (⌘,). Search filters every pane. Changes apply immediately; there is no Save button." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="general" hint-size="100%,100%"></dc-import></dc-import>

<dc-import name="FmBoard" bid="a11-1b" num="11.1c" title="Settings — Language and region" note="The app language switches live. Document languages drive OCR, spell-check and hyphenation; region formats drive dates, numbers (decimal comma), paper size, units and the first day of the week, each previewed." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="language" hint-size="100%,100%"></dc-import></dc-import>
<dc-import name="FmBoard" bid="a11-1c" num="11.1d" title="Settings — Editing" tags="{{ tG43 }}" note="G43 · Edit marking, what happens when a font lacks a character, the font for new text, reflow, version history and recovery copies. The Saving group explains that changes are added to the end of the file (faster, and signatures stay intact), names Optimize and clean as the only way to rewrite the whole file, and shows where recovery copies are kept. The interval stays one minute. There is no overflow default (chosen per edit, 3.4) and no switch for the signed-document warning, which always shows." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="editing" hint-size="100%,100%"></dc-import></dc-import>
<dc-import name="FmBoard" bid="a11-1d" num="11.1e" title="Settings — Fonts" note="Installed fonts with a Turkish test string and script coverage chips, filterable to fonts that cover Turkish. Coverage is read from the font files, not guessed from names." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="fonts" hint-size="100%,100%"></dc-import></dc-import>
<dc-import name="FmBoard" bid="a11-1e" num="11.1f" title="Settings — Signatures and certificates" note="Saved signatures, certificates with their state, the e-imza card driver and the timestamp server in one place." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="signatures" hint-size="100%,100%"></dc-import></dc-import>

<dc-import name="FmBoard" bid="a11-1g" num="11.1h" title="Settings — AI assistant" note="On, with the local model. Deleting the model frees its 4,1 GB." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="ai" hint-size="100%,100%"></dc-import></dc-import>
<dc-import name="FmBoard" bid="a11-1h" num="11.1i" title="Settings — Privacy" note="The no-telemetry statement as fact, then every network use listed with its own switch, plus a log of actual connections." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="privacy" hint-size="100%,100%"></dc-import></dc-import>
<dc-import name="FmBoard" bid="a11-1h-m1" num="11.1i" title="Settings — Privacy, M1 build" meta="macOS · Light · {{ L.name }}" tags="{{ tG89p }}" gl="{{ gl }}" gl-opts="{{ glOpts }}" on-gl="{{ setGl }}" lang="{{ L.lang }}" dir="{{ L.dir }}" note="G89 · G10 · Nothing connects in M1, so all five switches show off and are disabled with “Available in a future version” (tooltip on the first), and so is Show network activity. The pane never claims a connection the app doesn’t make. Each switch takes its default when its feature ships: the update check on (M5), the others off until used. Signature checks stays disabled until the owner decides on revocation lookups (G51, Q06)." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="privacy" gated="m1" lang="{{ L.fs }}" hint-size="100%,100%"></dc-import></dc-import>

<dc-import name="FmBoard" bid="a11-1j" num="11.1k" title="Settings — Keyboard shortcuts" tags="{{ tG44 }}" note="G44 · Search by name or by pressing keys. Recording a shortcut that’s taken says which command has it and asks before reassigning. ⌥⌘S belongs to Save a copy; the sidebar moved to ⌃⌘S (Ctrl+Alt+S on Windows and Linux, where Save a copy has no key); Add signature is ⇧S in Fill &amp; Sign. One table feeds every tooltip, menu and this pane, and a test fails on any duplicate per platform. Presets match Acrobat or Preview for people switching." hint-size="1440px,1020px"><dc-import name="FmSettings" pane="shortcuts" hint-size="100%,100%"></dc-import></dc-import>

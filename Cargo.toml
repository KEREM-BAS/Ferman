# Ferman engine workspace: seven crates with the dependency graph of docs/ARCHITECTURE.md §2.2.
# Every dependency is listed with its licence in docs/DEPENDENCIES.md, updated in the same change.

[workspace]
members = ["crates/*"]
# Workspaces of their own, never shipped: the cargo-fuzz targets (NCSA libfuzzer-sys stays out of this
# graph) and the corpus generators (ADR 0020).
exclude = ["fuzz", "tools/corpus"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor set by the planned dependencies (docs/DEPENDENCIES.md §6). The pinned toolchain in
# rust-toolchain.toml (1.99.0) is what builds Ferman.
rust-version = "1.88"
license = "Apache-2.0"
publish = false
authors = ["The Ferman Authors"]
repository = "https://github.com/KEREM-BAS/Ferman"

[workspace.dependencies]
# Ferman crates: unpublished path dependencies without a version requirement (deny.toml sets
# allow-wildcard-paths), so a version bump touches only [workspace.package].
ferman-core = { path = "crates/ferman-core" }
ferman-fonts = { path = "crates/ferman-fonts" }
ferman-text = { path = "crates/ferman-text" }
ferman-render = { path = "crates/ferman-render" }
ferman-ops = { path = "crates/ferman-ops" }
# default-features = false here, so a member can opt out of defaults (edition 2024 requires it).
ferman-api = { path = "crates/ferman-api", default-features = false }

# Shipped dependencies.
thiserror = "2.0.21"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "string"] }
# The crate, the Dart package and flutter_rust_bridge_codegen must be exactly the same version.
flutter_rust_bridge = "=2.13.0"
# Pinned exactly: PDFium (tools/pdfium, tag chromium/7881) and pdfium-render move together, in one
# commit (ADR 0004). Default features off: no `image` until pages render (M2), and the API level is
# named instead of `pdfium_latest`, so a pdfium-render update cannot move it silently.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
# Replies from the render thread: a oneshot future that async API functions await without blocking.
futures-channel = "0.3.34"
# Stream filters in ferman-core: Flate through the pure-Rust miniz_oxide backend, and LZW.
flate2 = "1.1.10"
weezl = "0.2.1"
# The document model (ADR 0004), pinned exactly: breaking releases come almost monthly. Default
# features off: no chrono and no rayon (objects load on the calling thread).
lopdf = { version = "=0.45.0", default-features = false }
# The file's SHA-256 fingerprint, and with md-5, aes and rc4 the standard security handler of
# ferman-core (the versions lopdf 0.45 uses, so the graph holds one of each). Their `zeroize`
# features wipe hash states, key schedules and cipher states when they are dropped.
sha2 = { version = "0.11.1", features = ["zeroize"] }
md-5 = { version = "0.11.0", features = ["zeroize"] }
aes = { version = "0.9.2", features = ["zeroize"] }
rc4 = { version = "0.2.0", features = ["zeroize"] }
# SASLprep of revision 6 passwords (RFC 4013): stringprep's tables, with NFKC from
# unicode-normalization (the versions stringprep pulls), so the prepared password lands in a buffer
# that is wiped.
stringprep = "0.1.5"
unicode-normalization = "0.1.26"
# The bidi algorithm for right-to-left text (ferman-text), the version stringprep already pulls.
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
# Passwords and keys are wiped from memory when dropped (docs/ARCHITECTURE.md §9.2).
zeroize = "1.9.1"
# The render thread's request channel and its caches (ADR 0009). lru without its default hashbrown
# backend: the standard HashMap is enough.
crossbeam-channel = "0.5.17"
lru = { version = "0.19.0", default-features = false }

# Dev and test only; never in the shipped graph.
insta = "1.49.0"
proptest = "1.12.0"
# Benchmarks (docs/ARCHITECTURE.md §13.7). Default features off: no plotting and no rayon.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# Every public item is documented. A warning here; CI turns it into an error with -D warnings.
missing_docs = "warn"
# flutter_rust_bridge's #[frb] attribute expands to cfg_attr(frb_expand, …); codegen sets that cfg
# when it expands the crate. Declared here as FRB's own templates do (a member cannot add lints next
# to `workspace = true`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
# unsafe_code is deliberately not set here: each crate root carries #![forbid(unsafe_code)], except
# ferman-api, which uses #![deny(unsafe_code)] so the FRB-generated module can be allowed (ADR 0010).
# unreachable_pub is not enabled: the FRB-generated module in ferman-api is full of `pub` items in a
# private module and would need its own exemption, for little gain in a workspace of unpublished crates.

[workspace.lints.clippy]
# No panics in library code (ADR 0010). Tests may unwrap and expect (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Leftover debugging output; logs go through tracing and stay on the device.
dbg_macro = "deny"
# println!/eprintln! panic when the stream is closed; write through std::io and handle the error.
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
# ADR 0010: ferman-api catches panics at its entry points as a last resort, which needs unwinding.
panic = "unwind"
